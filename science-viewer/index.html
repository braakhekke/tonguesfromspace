<!doctype html><html lang="en"><head><meta charset="utf-8"><base href="/science-viewer/"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zmutt · Science viewer</title><link rel="stylesheet" href="../css/tokens.css"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden}#explorer{display:block;border:0;width:100%;height:100%}</style></head><body>
<iframe id="explorer" title="Tongues from Space · Zmutt science viewer" src="../index.html#g=zmutt&m=single&one=2023"></iframe>
<template id="scienceTemplate">
<div id="scienceData" class="science-data">
  <h3 class="side-label">Your field data <span class="science-local">Local only</span></h3>
  <div class="row"><button id="openFiles" class="act">Open data</button><button id="demo" class="act">Example</button></div><input id="file" type="file" accept=".tif,.tiff,.geojson,.json,.jsonl,.ndjson,.csv,.tsv,.txt,.gpx,.kml,.kmz,.zip,.shp,.shx,.dbf,.prj,.cpg,.gpkg,.fgb,.gml,.xml,.dxf,.tab,.map,.id,.mif,.mid,.sdat,.sgrd,.ige,.asc,.grd,.img,.bil,.hdr,.dat,.bin,.vrt,.png,.jpg,.jpeg,.pgw,.jgw,.tfw,.wld,.nc,.grb,.grib,.xyz,.las,.laz,.wkt" multiple hidden>
  <p id="scienceStatus" class="landsat-info" role="status" aria-live="polite">Ready. Files stay on this computer.</p><button id="cancel" class="act" hidden>Cancel reading</button>
  <fieldset id="importMapping" hidden><legend id="mappingTitle">Map file fields</legend><p id="mappingReason" class="landsat-info"></p><label>Source coordinate system<select id="mappingCrs"><option value="">Choose the source CRS</option><option value="EPSG:4326">WGS84 · latitude/longitude</option><option value="EPSG:2056">Swiss LV95 · EPSG:2056</option><option value="EPSG:21781">Swiss LV03 · EPSG:21781</option><option value="EPSG:3857">Web Mercator · EPSG:3857</option><option value="EPSG:32632">WGS84 / UTM 32N</option><option value="EPSG:32633">WGS84 / UTM 33N</option></select></label><div id="mappingColumns"><label>X / longitude column<select id="mappingX"></select></label><label>Y / latitude column<select id="mappingY"></select></label><label>WKT geometry column<select id="mappingGeometry"></select></label><label>Acquisition date column<select id="mappingDate"></select></label><label>Measurement column<select id="mappingValue"></select></label><label>Unit column<select id="mappingUnit"></select></label></div><p class="landsat-info">Choose columns already in the file. Dates and units are never typed or invented.</p><div class="row"><button id="mappingApply" class="act">Import with these fields</button><button id="mappingCancel" class="act">Skip file</button></div></fieldset>
  <div id="fileControls" hidden>
    <ul id="datasetList" class="glaciers science-files" aria-label="Local datasets"></ul>
    <div id="fileCard" class="science-file-card"><div class="row"><strong id="fileName"></strong><button id="remove" class="act" aria-label="Remove selected file">Remove</button></div><label id="bandRow"><span id="bandLabel">Band</span> <select id="band"></select></label><dl class="science-metadata"><div><dt>Acquired</dt><dd id="date"></dd></div><div><dt>Value unit</dt><dd id="unit"></dd></div></dl><p id="metadataNote" class="landsat-info"></p><details><summary>File details</summary><p id="metadata" class="landsat-info"></p><p id="metadataSource" class="landsat-info"></p></details></div>
    <details open><summary>Layer display</summary><label id="vectorFieldRow" hidden>Measurement property<select id="vectorValueField"></select></label><label id="rasterModeRow" hidden>Display<select id="rasterMode"><option value="band">Measurement band</option><option value="rgb">RGB image</option></select></label><label class="toggle"><input id="visible" type="checkbox" checked><span>Show field data</span></label><label class="slider-row" for="opacity"><span>Opacity</span><output id="opacityValue">75 %</output></label><input id="opacity" class="frame" type="range" min="0" max="1" step="0.05" value="0.75"><div class="row science-range"><label>Minimum<input id="low" type="number" step="any" value="-10"></label><label>Maximum<input id="high" type="number" step="any" value="5"></label></div><canvas id="legend" width="256" height="10"></canvas><div class="science-scale"><span id="legendLow"></span><span id="legendHigh"></span></div><button id="range" class="act">Fit colour range</button><button id="fit" class="act">Find my data</button><p id="temporal" class="landsat-info"></p></details>
    <div class="row"><button id="save" class="act">Save data settings</button><button id="restoreButton" class="act">Restore settings</button></div><input id="restore" type="file" accept=".json" hidden>
  </div>
  <details><summary>Supported files</summary><p class="landsat-info">Points, lines and polygons: GeoJSON / NDJSON, shapefile (ZIP or select .shp with .dbf and .prj), GeoPackage, FlatGeobuf, KML / KMZ, GPX, GML, DXF and WKT. Tables: CSV / TSV with coordinates or WKT; choose the existing date, value and unit columns.</p><p class="landsat-info">Rasters: GeoTIFF / BigTIFF, RGB imagery with georeferencing, ASCII grids, ENVI and other GDAL-supported grids. Select sidecar files together. Classic NetCDF supports regular latitude/longitude grids and time slices. Small LAS / LAZ point clouds through version 1.3 are shown as points.</p><p class="landsat-info">Large surveys: use tiled GeoTIFFs with overviews. Other in-memory imports have explicit preview limits. NetCDF-4 / HDF5, curvilinear grids, LAS 1.4 / COPC and VRT need conversion first. Geometry is draped on terrain; point clouds are not a volumetric 3D renderer.</p></details>
  <details><summary>About local data</summary><p class="landsat-info">Acquisition dates and units come from the file and band. Missing values stay unknown. Dates with matching units can be compared or played in order. Vector layers are draped on the selected terrain; supplied Z coordinates are retained for inspection rather than treated as a vertical datum. Files are read locally; tiled GeoTIFFs use bounded windows. Other formats use limited in-memory imports. Stored values are shown without file scale/offset. Explorer exports and gallery sharing retain their original background-layer behaviour; local field data are not included in those exports.</p></details>
</div>
</template>
<script type="module" src="app.js"></script></body></html>
