# Builds glaciers.js and thickness.js from GLAMOS, checks the result and publishes the site on Cloudflare (Worker with static assets).
# Runs on every push to main, on the 1st of each month, and on demand (Actions tab -> Run workflow).
name: Build data and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 1 * *"
  workflow_dispatch:

permissions:
  contents: write      # commit the refreshed glaciers.js and thickness.js

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download GLAMOS data and build glaciers.js and thickness.js
        id: data
        if: github.ref == 'refs/heads/main'      # a run started from a tag (a rollback) publishes what that tag holds: no new data
        continue-on-error: true      # if GLAMOS is unreachable, publish with the last committed data
        run: python scripts/build_outlines.py --out data/glaciers.js

      - name: Download the RGI outlines of Vatnajökull and build vatnajokull.js
        id: iceland
        if: github.ref == 'refs/heads/main'
        continue-on-error: true      # if GLIMS is unreachable, publish with the last committed data
        run: python scripts/build_vatnajokull.py

      - name: Commit the generated data files if they changed
        if: (steps.data.outcome == 'success' || steps.iceland.outcome == 'success') && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git add data/glaciers.js data/thickness.js data/vatnajokull.js
          if git diff --cached --quiet; then
            echo "glaciers.js unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update glacier data from GLAMOS [skip ci]"
            git push
          fi

      - uses: actions/setup-node@v4          # the page's bundle (esbuild) and `node --check` in scripts/check_syntax.py
        with:
          node-version: "22"
      - name: Install the build tools (esbuild, TypeScript)
        run: npm ci
      - name: Collect site files (split glaciers.js, content hashes, config.js)
        env:
          CDSE_RELAY_URL: ${{ vars.CDSE_RELAY_URL }}   # Settings -> Secrets and variables -> Actions -> Variables
          STREETVIEW_EMBED_KEY: ${{ vars.STREETVIEW_EMBED_KEY }}   # the public Maps Embed API key (restricted to the site's address); without it the Street View layer stays hidden
          CF_WEB_ANALYTICS_TOKEN: ${{ vars.CF_WEB_ANALYTICS_TOKEN }}   # the Cloudflare Web Analytics site token (cookieless page views); empty = no beacon
          PUBLISH_ICELAND: ${{ vars.PUBLISH_ICELAND }}   # set to 1 to show Iceland (menu entry, /iceland/ addresses, sitemap) on the public site; empty = hidden
          PUBLISH_NORWAY: ${{ vars.PUBLISH_NORWAY }}   # set to 1 to show mainland Norway and Svalbard (menu entries, /norway/ addresses, sitemap) on the public site; empty = hidden
          PUBLISH_LANDSAT: ${{ vars.PUBLISH_LANDSAT }}   # set to 1 to show the Landsat switch (years before 2016); the pictures themselves are not in the repository
        run: |
          python scripts/build_site.py _site
          cat _site/config.js | head -c 400; echo

      # Nothing is published unless these pass: they look at exactly the files that would go live.
      - name: Syntax of the scripts, pages, Worker and data files
        run: python scripts/check_syntax.py
      - name: Names, properties and argument counts (TypeScript, no types to write)
        run: python scripts/check_types.py
      - name: Install the test browser
        run: |
          pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Tests on the built site
        run: |
          TFS_SITE_DIR=_site python -m unittest tests.test_site -v
          python -m unittest tests.test_worker -v

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          include-hidden-files: true
          retention-days: 3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - name: Fill in the KV namespace and R2 bucket of the Worker
        run: |
          sed -i "s/__KV_CACHE_ID__/${{ vars.CF_KV_CACHE_ID }}/; s/__R2_GALLERY_BUCKET__/${{ vars.CF_R2_GALLERY_BUCKET }}/; s/__R2_LANDSAT_BUCKET__/${{ vars.CF_R2_LANDSAT_BUCKET }}/" worker/wrangler.toml
          grep -qE '^[^#]*__[A-Z_]+__' worker/wrangler.toml && { echo "Set the repository variables CF_KV_CACHE_ID, CF_R2_GALLERY_BUCKET and CF_R2_LANDSAT_BUCKET"; exit 1; } || true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deploy the Worker and the site to Cloudflare
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy

      # Rollback points. Every deploy from main gets a tag deploy-<UTC date and time>-<commit> that never moves, and the tag `live` moves to it. To go back: Actions ->
      # Build data and deploy -> Run workflow -> "Use workflow from": choose the tag (Tags tab) -> Run. That builds, tests and deploys what the tag holds, and moves `live`
      # to it. A failed tagging must never fail a deploy that went through. See docs/OPERATIONS.md.
      - name: Tag what is live
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/deploy-') || startsWith(github.ref, 'refs/tags/known-good-')
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            git tag -f -a live -m "Live now: rolled back to $GITHUB_REF_NAME (run ${{ github.run_id }})" "$GITHUB_REF_NAME^{commit}"
          else
            tag="deploy-$(date -u +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)"
            git tag -a "$tag" -m "Live on tonguesfromspace.org (run ${{ github.run_id }})"
            git push origin "refs/tags/$tag"
            git tag -f -a live -m "Live now: $tag"
          fi
          git push -f origin refs/tags/live
