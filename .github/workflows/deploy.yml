# Builds glaciers.js and thickness.js from GLAMOS, checks the result and publishes the site on GitHub Pages.
# Runs on every push to main, on the 1st of each month, and on demand (Actions tab -> Run workflow).
name: Build data and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 1 * *"
  workflow_dispatch:

permissions:
  contents: write      # commit the refreshed glaciers.js and thickness.js
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download GLAMOS data and build glaciers.js and thickness.js
        id: data
        continue-on-error: true      # if GLAMOS is unreachable, publish with the last committed data
        run: python scripts/build_outlines.py --out data/glaciers.js

      - name: Commit glaciers.js and thickness.js if they changed
        if: steps.data.outcome == 'success' && github.event_name != 'pull_request'
        run: |
          git add data/glaciers.js data/thickness.js
          if git diff --cached --quiet; then
            echo "glaciers.js unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update glacier data from GLAMOS [skip ci]"
            git push
          fi

      - name: Collect site files (split glaciers.js, content hashes, config.js)
        env:
          CDSE_RELAY_URL: ${{ vars.CDSE_RELAY_URL }}   # Settings -> Secrets and variables -> Actions -> Variables
        run: |
          python scripts/build_site.py _site
          cat _site/config.js | head -c 400; echo

      # Nothing is published unless these pass: they look at exactly the files that would go live.
      - uses: actions/setup-node@v4          # only for `node --check` in scripts/check_syntax.py
        with:
          node-version: "22"
      - name: Syntax of the scripts, pages, Worker and data files
        run: python scripts/check_syntax.py
      - name: Names, properties and argument counts (TypeScript, no types to write)
        run: python scripts/check_types.py
      - name: Install the test browser
        run: |
          pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Tests on the built site
        run: |
          TFS_SITE_DIR=_site python -m unittest tests.test_site -v
          python -m unittest tests.test_worker -v

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
