<!doctype html><meta charset="utf-8"><title>Least snow: statistics over the 2023 outline</title>
<body style="font:13px sans-serif;background:#10181d;color:#ddd"><p id="s">Starting…</p>
<p>Driver for the least-snow experiment (see README.md). Needs scripts/serve.py or the relay in config.js, and a receiver on localhost:8765 that stores the posted JSON.</p>
<iframe id="f" src="../../tools/pick-scenes.html" style="width:1200px;height:700px"></iframe>
<script>
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const post=o=>fetch('http://localhost:8765/',{method:'POST',body:JSON.stringify(o)}).catch(()=>{});
const R=6378137, merc=(lon,lat)=>[Math.round(R*lon*Math.PI/180), Math.round(R*Math.log(Math.tan(Math.PI/4+lat*Math.PI/360)))];
function dp(pts,tol){                       // Douglas-Peucker on a closed ring (metres); split at the point farthest from the start, because start and end coincide
  const n=pts.length; let m=1, far=-1;
  for(let i=1;i<n-1;i++){ const d=Math.hypot(pts[i][0]-pts[0][0],pts[i][1]-pts[0][1]); if(d>far){far=d;m=i;} }
  const keep=new Uint8Array(n); keep[0]=keep[m]=keep[n-1]=1; const st=[[0,m],[m,n-1]];
  while(st.length){ const [a,b]=st.pop(); if(b-a<2) continue; let md=0, mi=-1; const [ax,ay]=pts[a], [bx,by]=pts[b], dx=bx-ax, dy=by-ay, L=Math.hypot(dx,dy)||1;
    for(let i=a+1;i<b;i++){ const d=Math.abs((pts[i][0]-ax)*dy-(pts[i][1]-ay)*dx)/L; if(d>md){md=d;mi=i;} }
    if(md>tol&&mi>0){ keep[mi]=1; st.push([a,mi],[mi,b]); } }
  return pts.filter((_,i)=>keep[i]);
}
const ringArea=r=>Math.abs(r.reduce((s,p,i)=>{const q=r[(i+1)%r.length];return s+p[0]*q[1]-q[0]*p[1];},0))/2;
function shape(outline){                    // simplified 2023 outline in Web Mercator, as small as the relay allows (20000 characters per request)
  const rings=outline.coordinates.map(poly=>poly.map(r=>r.map(([x,y])=>merc(x,y))));
  for(const tol of [15,25,35,50,70,100]){
    const co=rings.map(poly=>poly.map(r=>{ if(ringArea(r)<5000) return null; const s=dp(r,tol); return s.length>=4?s:null; }).filter(Boolean)).filter(p=>p.length);
    const txt=JSON.stringify(co); if(txt.length<12500) return {co,tol,len:txt.length};
  } throw new Error('outline too large');
}
(async()=>{
 const f=document.getElementById('f'); await new Promise(r=>f.onload=r); await sleep(3000);
 const w=f.contentWindow, DATA=w.GLACIER_DATA, bad=[];
 const orig=w.relay; w.relay=(route,body,accept)=>{ if(route==='statistics'&&!(body.input.bounds.geometry)) bad.push(1); return orig(route,body,accept); };   // a fallback to the bounding box would measure the wrong area
 for(const g of DATA.glaciers){
  try{
   const sh=shape(g.outline), xs=sh.co.flat(2).map(p=>p[0]), ys=sh.co.flat(2).map(p=>p[1]);
   const bnd={bbox:[Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)],geometry:{type:'MultiPolygon',coordinates:sh.co}};
   document.getElementById('s').textContent=g.name;
   const out=[]; const years=[]; for(let y=2016;y<=new Date().getUTCFullYear();y++) years.push(y);
   const res=await Promise.all(years.map(y=>w.statsYear(bnd,y,40)));
   res.forEach((l,i)=>l.forEach(c=>out.push({...c,year:years[i]})));
   await post({id:g.id,name:g.name,tol:sh.tol,len:sh.len,fallbacks:bad.length,scenes:out});
  }catch(e){ await post({id:g.id,error:String(e&&e.message||e)}); }
 }
 await post({done:true});
})();
</script>
