# The one Worker of tonguesfromspace.org: it serves the site (static files from ../_site, built by
# scripts/build_site.py) and the relay (/cdse/*) and gallery (/gallery/*) and glacier-request (/ask/*) back end of worker.js.
# The deploy workflow (.github/workflows/deploy.yml) runs `wrangler deploy` from this folder after the
# build; the KV namespace id and R2 bucket name come from the repository variables CF_KV_CACHE_ID and
# CF_R2_GALLERY_BUCKET and CF_R2_LANDSAT_BUCKET (the workflow replaces the three __…__ words below).
# The Landsat pictures (data/landsat/, 197 MB, not in the repository) live in the R2 bucket LANDSAT under the same paths; upload them from the working
# copy with scripts/upload_landsat.sh whenever build_landsat.py has made new ones.
# By hand:  npx wrangler deploy   (secrets: npx wrangler secret put CDSE_CLIENT_ID, CDSE_CLIENT_SECRET, …)
name = "tonguesfromspace-relay"
main = "main.ts"          # the relay by meaning under /api/ and, for everything else, worker.js
compatibility_date = "2024-09-23"
keep_vars = true          # keep variables set in the dashboard (TURNSTILE_SITEKEY, …); ALLOWED_ORIGINS below wins

[observability]
enabled = true        # Workers Logs: the failures the relay writes with console.error (logError in worker.js), the gallery ping and any uncaught exception. Read them in the dashboard (Workers -> this Worker -> Logs) or with `npx wrangler tail`
head_sampling_rate = 1      # keep every line: there are few

[vars]
ALLOWED_ORIGINS = "https://tonguesfromspace.org,https://www.tonguesfromspace.org,http://localhost:8000"

# Static site. Only the relay (/api/ by meaning, /cdse/ raw) and gallery paths run the Worker first; everything else is a file.
[assets]
directory = "../_site"
not_found_handling = "404-page"
binding = "ASSETS"      # the Worker reads the files itself for the videos (Range requests)
run_worker_first = ["/api/*", "/cdse/*", "/gallery/*", "/ask/*", "/ev", "/data/landsat/*", "/images/*.mp4", "/teaser/*.mp4"]

[[kv_namespaces]]
binding = "CACHE"
id = "__KV_CACHE_ID__"

[[r2_buckets]]
binding = "GALLERY"
bucket_name = "__R2_GALLERY_BUCKET__"

[[r2_buckets]]
binding = "LANDSAT"
bucket_name = "__R2_LANDSAT_BUCKET__"

# Which controls are used (js/track.js -> /ev). Query it with the SQL API: SELECT blob1 AS event, SUM(_sample_interval) AS n FROM tsf_events GROUP BY event ORDER BY n DESC
[[analytics_engine_datasets]]
binding = "EVENTS"
dataset = "tsf_events"
