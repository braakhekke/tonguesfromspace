<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Landsat 7 gap fill, Aletsch</title>
<style>
body{margin:0;font:14px/1.4 "Schibsted Grotesk",system-ui,sans-serif;background:#111;color:#eee}
header{padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
button{background:#222;color:#eee;border:1px solid #444;border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer}
button.on{background:#C8322A;border-color:#C8322A}
#info{padding:0 16px 8px;color:#bbb;font-size:12.5px}
#stage{display:flex;justify-content:center;padding:0 16px 16px}
img{max-width:100%;max-height:calc(100vh - 150px);object-fit:contain}
</style>
<header><strong>Aletsch, Landsat 7 after the scanner failed (31 May 2003), stripes filled</strong>
<span id="yrs"></span><label><input type="checkbox" id="flash"> hold space to see nothing else</label></header>
<div id="info"></div><div id="stage"><img id="im" alt=""></div>
<script>
fetch('/data/landsat/aletsch.json').then(r=>r.json()).then(j=>{
  const S=Object.entries(j.scenes).filter(([y,v])=>v.sat==='landsat-7'&&v.date>='2003-05-31');
  const yrs=document.getElementById('yrs'),im=document.getElementById('im'),info=document.getElementById('info');
  function show(y,b){const v=j.scenes[y];im.src=`/data/landsat/aletsch/${y}.jpg`;
    [...yrs.children].forEach(x=>x.classList.toggle('on',x===b));
    info.textContent=`${v.date} · ${v.id} · cloud ${Math.round(v.cloud*100)} %`+(v.fills?` · filled ${(v.filled*100).toFixed(1)} % of the picture from `+v.fills.map(f=>`${f.sat} ${f.date}`).join(' and '):' · no fill record');}
  S.forEach(([y],i)=>{const b=document.createElement('button');b.textContent=y;b.onclick=()=>show(y,b);yrs.append(b);if(!i)show(y,b)});
  addEventListener('keydown',e=>{const k=[...yrs.children],i=k.findIndex(x=>x.classList.contains('on'));
    if(e.key==='ArrowRight'&&i<k.length-1)k[i+1].click();if(e.key==='ArrowLeft'&&i>0)k[i-1].click();});
});
</script>
