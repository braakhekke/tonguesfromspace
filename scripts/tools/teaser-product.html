<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teaser: the exported files</title>
<style>
@font-face{font-family:'Schibsted Grotesk';src:url('../../fonts/SchibstedGrotesk-Variable.woff2') format('woff2');font-weight:400 900}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Schibsted Grotesk',system-ui,sans-serif}
body{background:radial-gradient(ellipse at 66% 50%,#1a2733 0,#0a1118 62%,#05090f 100%)}
.phone{position:absolute;left:50%;top:50%;width:250px;height:510px;margin:-255px 0 0 80px;border-radius:30px;background:#05080c;padding:7px;box-shadow:0 24px 70px rgba(0,0,0,.6),0 0 0 1.5px #2b3946 inset;transform:translateY(30px);opacity:0;transition:opacity .8s,transform 1.1s cubic-bezier(.2,.8,.2,1)}
.phone video{width:100%;height:100%;object-fit:cover;border-radius:24px;display:block;background:#000}
.card{position:absolute;left:50%;top:50%;width:250px;margin:-95px 0 0 -210px;overflow:hidden;box-shadow:0 20px 56px rgba(0,0,0,.55);transform:translateY(30px);opacity:0;transition:opacity .8s .5s,transform 1.1s .5s cubic-bezier(.2,.8,.2,1)}
.card img{width:100%;display:block}
.on .phone{opacity:1;transform:none}
.on .card{opacity:1;transform:none}
</style></head><body>
<div class="phone"><video id="v" src="../../teaser/work/export-916.mp4" muted playsinline preload="auto"></video></div>
<div class="card"><img id="im" src="../../teaser/work/export-image.jpg" alt=""></div>
<script>
window.go = () => { document.body.classList.add('on'); const v = document.getElementById('v'); v.currentTime = 0; v.play(); };
window.ready = () => new Promise(r => { const v = document.getElementById('v'), i = document.getElementById('im'); const ok = () => v.readyState >= 3 && i.complete ? r() : setTimeout(ok, 100); ok(); });
</script></body></html>
