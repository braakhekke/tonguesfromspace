<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teaser: the exported files</title>
<style>
@font-face{font-family:'Schibsted Grotesk';src:url('../../fonts/SchibstedGrotesk-Variable.woff2') format('woff2');font-weight:400 900}
html,body{margin:0;height:100%;background:#0A1322;font-family:'Schibsted Grotesk',system-ui,sans-serif;overflow:hidden}
body{background:radial-gradient(ellipse at 70% 45%,#1b3350 0,#0A1322 62%)}
.phone{position:absolute;right:9%;top:50%;width:310px;height:630px;margin-top:-330px;border-radius:34px;background:#05080f;padding:9px;box-shadow:0 30px 80px rgba(0,0,0,.65),0 0 0 2px #2a3a52 inset;transform:translateY(40px) rotate(2deg);opacity:0;transition:opacity .8s,transform 1.2s cubic-bezier(.2,.8,.2,1)}
.phone video{width:100%;height:100%;object-fit:cover;border-radius:26px;display:block;background:#000}
.card{position:absolute;right:calc(9% + 270px);top:50%;margin-top:40px;width:290px;border-radius:12px;overflow:hidden;box-shadow:0 22px 60px rgba(0,0,0,.6);transform:translateY(40px) rotate(-5deg);opacity:0;transition:opacity .8s .5s,transform 1.2s .5s cubic-bezier(.2,.8,.2,1)}
.card img{width:100%;display:block}
.on .phone{opacity:1;transform:rotate(2deg)}
.on .card{opacity:1;transform:rotate(-5deg)}
.tags{position:absolute;left:0;right:0;bottom:22px;display:flex;justify-content:flex-start;padding-left:48px;gap:10px;opacity:0;transition:opacity .8s 1.2s}
.on .tags{opacity:1}
.tags span{color:#fff;font-weight:700;font-size:13px;padding:7px 14px;border-radius:99px;background:rgba(255,255,255,.12)}
</style></head><body>
<div class="phone"><video id="v" src="../../teaser/work/export-916.mp4" muted playsinline preload="auto"></video></div>
<div class="card"><img id="im" src="../../teaser/work/export-image.jpg" alt=""></div>
<div class="tags"><span>16:9</span><span>9:16</span><span>4:5</span><span>MP4 · JPEG</span></div>
<script>
window.go = () => { document.body.classList.add('on'); const v = document.getElementById('v'); v.currentTime = 0; v.play(); };
window.ready = () => new Promise(r => { const v = document.getElementById('v'), i = document.getElementById('im'); const ok = () => v.readyState >= 3 && i.complete ? r() : setTimeout(ok, 100); ok(); });
</script></body></html>
